services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mwendo
      POSTGRES_USER: mwendo
      POSTGRES_PASSWORD: mwendo  # local development only
    ports:
      - "5433:5432"
    volumes:
      - mwendo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mwendo -d mwendo"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  mwendo_pgdata:
